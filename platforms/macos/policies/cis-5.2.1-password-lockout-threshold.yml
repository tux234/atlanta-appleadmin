- name: macOS - CIS 5.2.1 - Account locks after 5 or fewer failed password attempts
  query: |
    SELECT 1 FROM password_policy
    WHERE json_valid(policy_parameters)
      AND CAST(json_extract(policy_parameters, '$.policyAttributeMaximumFailedAuthentications') AS INTEGER) BETWEEN 1 AND 5;
  critical: false
  description: Without an account lockout threshold, an attacker with physical access can guess passwords indefinitely. CIS macOS Benchmark 5.2.1 (Level 1) requires lockout after 5 or fewer failed attempts.
  resolution: |
    Fleet installs the "CIS - Password policy" configuration profile on this Mac automatically. If this check keeps failing, open System Settings > General > Device Management and confirm the profile is listed, then contact IT.
  platform: darwin
