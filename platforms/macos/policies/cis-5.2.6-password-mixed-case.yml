- name: macOS - CIS 5.2.6 - Password requires uppercase and lowercase letters
  query: |
    SELECT 1 FROM password_policy
    WHERE policy_content LIKE '%(?=.*[A-Z])%'
      AND policy_content LIKE '%(?=.*[a-z])%';
  critical: false
  description: Requiring mixed case increases password complexity. CIS macOS Benchmark 5.2.6 (Level 2) requires at least one uppercase and one lowercase letter.
  resolution: |
    Fleet installs the "CIS - Password policy" configuration profile on this Mac automatically. If this check keeps failing, open System Settings > General > Device Management and confirm the profile is listed, then contact IT.
  platform: darwin
