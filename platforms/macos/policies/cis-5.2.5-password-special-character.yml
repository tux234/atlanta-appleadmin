- name: macOS - CIS 5.2.5 - Password requires a special character
  query: |
    SELECT 1 FROM password_policy
    WHERE policy_content LIKE '%(.*[^a-zA-Z0-9].*){%'
      AND CAST(SUBSTR(policy_content, INSTR(policy_content, '.*){') + 4) AS INTEGER) >= 1;
  critical: false
  description: Requiring a non-alphanumeric character increases password complexity. CIS macOS Benchmark 5.2.5 (Level 2) requires at least one special character.
  resolution: |
    Fleet installs the "CIS - Password policy" configuration profile on this Mac automatically. If this check keeps failing, open System Settings > General > Device Management and confirm the profile is listed, then contact IT.
  platform: darwin
