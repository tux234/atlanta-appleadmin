- name: macOS - CIS 5.2.8 - Password history remembers 24 or more passwords
  query: SELECT 1 FROM pwd_policy WHERE history_depth >= 24;
  critical: false
  description: Without password history, users can cycle back to a previous password immediately after a forced change. CIS macOS Benchmark 5.2.8 (Level 1) requires remembering at least 24 previous passwords.
  resolution: |
    Fleet installs the "CIS - Password policy" configuration profile on this Mac automatically. If this check keeps failing, open System Settings > General > Device Management and confirm the profile is listed, then contact IT.
  platform: darwin
