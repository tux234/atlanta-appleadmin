- name: macOS - CIS 5.2.3 and 5.2.4 - Password requires a letter and a number
  query: SELECT 1 FROM password_policy WHERE policy_identifier LIKE '%requireAlphanumeric%';
  critical: false
  description: Passwords drawn from a single character class are easier to guess. CIS macOS Benchmark 5.2.3 and 5.2.4 (Level 2) require at least one alphabetic and one numeric character.
  resolution: |
    Fleet installs the "CIS - Password policy" configuration profile on this Mac automatically. If this check keeps failing, open System Settings > General > Device Management and confirm the profile is listed, then contact IT.
  platform: darwin
