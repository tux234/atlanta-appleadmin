- name: macOS - CIS 5.2.2 - Password minimum length is 15 or more
  query: |
    SELECT 1 FROM password_policy
    WHERE (
        policy_content LIKE 'policyAttributePassword matches ''.{%'
        AND CAST(SUBSTR(policy_content, INSTR(policy_content, '.{') + 2) AS INTEGER) >= 15
      )
      OR (
        json_valid(policy_parameters)
        AND CAST(json_extract(policy_parameters, '$.minimumLength') AS INTEGER) >= 15
      );
  critical: false
  description: Short passwords are easier to brute-force. CIS macOS Benchmark 5.2.2 (Level 1) requires a minimum password length of 15 characters.
  resolution: |
    Fleet installs the "CIS - Password policy" configuration profile on this Mac automatically. If this check keeps failing, open System Settings > General > Device Management and confirm the profile is listed, then contact IT.
  platform: darwin
