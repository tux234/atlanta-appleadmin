- name: macOS - CIS 5.2.7 - Password expires within 365 days
  query: |
    SELECT 1 WHERE
      EXISTS (SELECT 1 FROM pwd_policy WHERE expires_every_n_days > 0 AND expires_every_n_days <= 365)
      OR EXISTS (SELECT 1 FROM pwd_policy WHERE days_to_expiration > 0 AND days_to_expiration <= 365);
  critical: false
  description: Passwords exposed through phishing or third-party breaches stay useful to attackers until they change. CIS macOS Benchmark 5.2.7 (Level 1) requires passwords to expire within 365 days.
  resolution: |
    Fleet installs the "CIS - Password policy" configuration profile on this Mac automatically. If this check keeps failing, open System Settings > General > Device Management and confirm the profile is listed, then contact IT.
  platform: darwin
